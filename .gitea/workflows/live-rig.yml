# The live rig: real dosemu, real BRE, Falcon's Eye and Immortal Barons, real
# packets.
#
# It can only run on novatest-hl, where the installs live under their own unix
# users, so it runs on a host-mode runner there: act_runner as user
# gitea-runner, registered to this repo alone with the label `novatest`
# (tests/live/runner/README.md). That user may run exactly one command as the
# rig user, tests/live/nightly.sh; everything else happens inside it.
#
# Host mode has no node, so no `uses:` actions: the steps are plain shell.
#
# Nightly on main, which moves the rig checkout forward first, so Renovate's
# merges are played against the real games every night. Dispatched on another
# branch, it tries that commit through run.sh --try and leaves the checkout on
# main. A full run is about 26 minutes, longer when the day's fixtures are
# rebuilt first.
name: live-rig

on:
  schedule:
    # Gitea reads this in UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  rig:
    runs-on: novatest
    timeout-minutes: 90
    steps:
      - name: Run the rig
        # A non-zero exit is a real failure: the suite skips itself only when
        # dosemu is missing, which on this host would be the news.
        run: |
          sudo -n -u novahub-t /srv/novatest/nova-hub/tests/live/nightly.sh \
            "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Where the transcripts are
        if: failure()
        # A failed game run is diagnosed from its dosemu transcript. They stay
        # on the rig; host mode has no artifact upload.
        run: |
          echo "dosemu transcripts: novatest-hl:/srv/novatest/logs"
          ls -t /srv/novatest/logs | head -20 || true
