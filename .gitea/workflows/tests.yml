# Fast checks. No dosemu, no games, no network - everything here runs anywhere
# Python 3.12 does, in a few seconds.
#
# The live rig is deliberately NOT here; it needs real dosemu and real game
# installs under real unix users. See live-rig.yml.
name: tests

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    # A hung test should fail the run, not hold the runner.
    timeout-minutes: 20
    env:
      # tests/test_identity_emulator.py runs the WorkOS adapter against the
      # emulator through npx. Without this it skips when Node is missing; here
      # Node is installed below, and losing it must fail the build instead.
      NOVA_REQUIRE_EMULATOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          # For the WorkOS emulator (npx workos@0.23.0 emulate).
          node-version: "22"

      - name: Fetch the WorkOS CLI
        # Into npx's cache, so the emulator test starts it in seconds. Its own
        # step so that a slow or failing download shows here, with npm's
        # output, rather than as an emulator that "did not start".
        timeout-minutes: 12
        run: |
          # Run 77 sat silent here for ten minutes; say where it stalls.
          curl -sS -o /dev/null -m 30 -w "registry: %{http_code} in %{time_total}s via %{remote_ip}\n" \
            https://registry.npmjs.org/workos
          npm config get registry
          timeout 300 npm view workos@0.23.0 version --loglevel http
          # Run 78: the download takes seconds, then the CLI itself never
          # returns. Run its binary directly, traced, to see what it waits on.
          npm install --no-save --prefix /tmp/wcli workos@0.23.0 --loglevel warn
          bin=$(ls /tmp/wcli/node_modules/@workos/cli-linux-x64/bin/workos)
          id; echo "HOME=$HOME"; ls -la "$HOME" | head
          command -v strace || (apt-get update -qq && apt-get install -y -qq strace) >/dev/null
          set +e  # the runner's bash -e would stop at the first timeout
          timeout 20 strace -f -tt -o /tmp/wcli.trace "$bin" --version; echo "direct rc=$?"
          grep -v "futex\|mmap\|mprotect\|rt_sig" /tmp/wcli.trace | tail -80
          HOME=$(mktemp -d) timeout 20 "$bin" --version; echo "fresh HOME rc=$?"
          set -e
          time timeout 300 npx -y --loglevel http workos@0.23.0 --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit and integration tests
        # Run the unit tree on its own FIRST, with the live tree not even
        # collected. A conftest hook sees every item in the session, not just
        # those under its own directory, and one in tests/live once skipped the
        # entire suite while reporting a clean run. This invocation cannot be
        # silenced that way, so it is the one that proves the unit tests ran.
        run: |
          python -m pytest tests/ --ignore=tests/live -q --tb=short

      - name: Whole tree collects, with the live rig skipping cleanly
        # Then the full session. Here the live tree is expected to skip -- no
        # dosemu, no NOVATEST_RIG -- but it must skip rather than error, and it
        # must not take the unit tests down with it.
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Migrations build a database from empty
        # Not covered by the suite above running green: this asserts the
        # documented install path works, which it did not until 8f90ffb.
        run: |
          NOVA_HUB_DB_URL="sqlite:///$(mktemp -d)/ci.db" python -m alembic upgrade head

      - name: Config example is valid and 8.3-clean
        # The cheap structural half of the R-3 guard, runnable against any
        # config. Catches a game path that the game could not traverse.
        run: |
          cp config.toml.example config.toml
          python - <<'PY'
          import sys, tomllib
          sys.path.insert(0, "tests/live")
          from rig.dospath import dos_path_problems
          cfg = tomllib.load(open("config.toml", "rb"))
          bad = []
          for number, games in cfg.get("dosemu", {}).items():
              if not isinstance(games, dict):
                  continue
              for game, settings in games.items():
                  if not isinstance(settings, dict):
                      continue
                  path = settings.get("game_dos_path")
                  if path:
                      bad += [f"{number}.{game}: {p}" for p in dos_path_problems(path)]
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("config.toml.example: all game paths are 8.3-clean")
          PY
